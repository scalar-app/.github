# The single source of truth for labels across every scalar-app repository.
# Repos sync against this file with .github/workflows/reusable-label-sync.yml,
# so edit labels here rather than in the GitHub UI. The label set itself is
# documented in CONTRIBUTING.md.

# Area: exactly one per issue or pull request.
- name: "area:web"
  color: "1f6feb"
  description: "Web application, browser client"
- name: "area:mobile"
  color: "1f6feb"
  description: "iOS and Android clients"
- name: "area:desktop"
  color: "1f6feb"
  description: "macOS, Windows and Linux shell"
- name: "area:api"
  color: "1f6feb"
  description: "HTTP API, auth, data model"
- name: "area:worker"
  color: "1f6feb"
  description: "Background jobs, sync, scheduling"
- name: "area:integrations"
  color: "1f6feb"
  description: "Provider connectors"
- name: "area:ai"
  color: "1f6feb"
  description: "Command loop, tools, model providers"
- name: "area:sdk"
  color: "1f6feb"
  description: "@scalar/sdk typed client"
- name: "area:ui"
  color: "1f6feb"
  description: "@scalar/ui tokens and components"
- name: "area:website"
  color: "1f6feb"
  description: "Public website"
- name: "area:docs"
  color: "1f6feb"
  description: "Documentation site and READMEs"
- name: "area:infra"
  color: "1f6feb"
  description: "Deployment, compose, CI, infrastructure"

# Type: what kind of change this is.
- name: "type:bug"
  color: "d73a4a"
  description: "Something is broken"
- name: "type:feature"
  color: "0e8a16"
  description: "New capability or enhancement"
- name: "type:refactor"
  color: "5319e7"
  description: "Internal change with no behavior change"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type:chore"
  color: "cfd3d7"
  description: "Tooling, dependencies, housekeeping"
- name: "type:security"
  color: "b60205"
  description: "Security fix or hardening"

# Priority: set by maintainers during triage.
- name: "priority:p0"
  color: "b60205"
  description: "Drop everything: data loss or security"
- name: "priority:p1"
  color: "e99695"
  description: "Next release"
- name: "priority:p2"
  color: "fbca04"
  description: "Planned"
- name: "priority:p3"
  color: "ededed"
  description: "Someday"

# Workflow and release notes.
- name: "good first issue"
  color: "ffd600"
  description: "Small, well scoped, good entry point"
- name: "help wanted"
  color: "ffd600"
  description: "Maintainers would welcome a contribution here"
- name: "breaking"
  color: "b60205"
  description: "Breaking change, called out in release notes"
- name: "skip-changelog"
  color: "cfd3d7"
  description: "Excluded from generated release notes"
- name: "needs-triage"
  color: "cfd3d7"
  description: "Not yet reviewed by a maintainer"
- name: "needs-info"
  color: "cfd3d7"
  description: "Waiting on the reporter for details"
- name: "blocked"
  color: "cfd3d7"
  description: "Waiting on something outside this repo"
